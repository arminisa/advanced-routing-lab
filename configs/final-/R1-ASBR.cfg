 ==========================================
! Router: R-ASBR
! Role: ASBR (OSPF <-> EIGRP boundary)
! ==========================================

hostname R-ASBR   
no ip domain lookup
       
interface Loopback0
 description Router-ID
 ip address 4.4.4.4 255.255.255.255
!         
interface Loopback10
 description summarization-Test
 no ip address
!         
interface Ethernet0/0
 no ip address
 shutdown 
 duplex auto
!         
interface GigabitEthernet0/0
 description link-to-R1-Core
 ip address 10.0.0.10 255.255.255.252
 duplex full
 speed 1000
 media-type gbic
 negotiation auto
!         
interface GigabitEthernet1/0
 description lin-to-E1
 ip address 10.0.0.13 255.255.255.252
 negotiation auto
!         
interface GigabitEthernet2/0
 description link-To-E2
 ip address 10.0.0.17 255.255.255.252
 negotiation auto
!         
router eigrp 10
 network 4.4.4.4 0.0.0.0
 network 10.0.0.12 0.0.0.3
 network 10.0.0.16 0.0.0.3
 redistribute ospf 1 metric 10000 100 255 1 1500 route-map rm-ospf-to-eigrp
 passive-interface Loopback0
 passive-interface GigabitEthernet0/0
!         
router ospf 1
 router-id 4.4.4.4
 redistribute eigrp 10 metric 100 metric-type 1 subnets
 passive-interface Loopback0
 network 4.4.4.4 0.0.0.0 area 0
 network 10.0.0.8 0.0.0.3 area 0 
!         
ip prefix-list Filter-172.17 seq 5 permit 172.17.0.0/22
no cdp log mismatch duplex
!         
route-map rm-ospf-to-eigrp deny 10
 match ip address prefix-list Filter-172.17
!         
route-map rm-ospf-to-eigrp permit 20
