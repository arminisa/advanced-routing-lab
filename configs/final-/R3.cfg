hostname R3
  
interface Loopback0
 description Router-ID
 ip address 3.3.3.3 255.255.255.255
!         
interface Loopback10
 description summarization-test
 ip address 172.17.1.1 255.255.255.0
!         
interface Loopback11
 description summarization-test
 ip address 172.17.2.1 255.255.255.0
!         
  
interface GigabitEthernet0/0
 ip address 10.0.0.6 255.255.255.252
 duplex full
 speed 1000
 media-type gbic
 negotiation auto
      
router ospf 1
 router-id 3.3.3.3
 passive-interface Loopback0
 passive-interface Loopback10
 passive-interface Loopback11
 network 3.3.3.3 0.0.0.0 area 2
 network 10.0.0.4 0.0.0.3 area 2
 network 172.17.1.0 0.0.0.255 area 2
 network 172.17.2.0 0.0.0.255 area 2
